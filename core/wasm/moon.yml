id: aureline-wasm
language: rust

tags:
  - rust
  - wasm
  - lang

dependsOn:
  - aureline-parser

tasks:
  build:
    command: "cargo build -p aureline-wasm"
    deps:
      - "aureline-parser:build"
    inputs:
      - "src/**/*.rs"
      - "Cargo.toml"
      - "/Cargo.toml"
      - "/Cargo.lock"
  check:
    command: "cargo check -p aureline-wasm"
    deps:
      - "aureline-parser:check"
    inputs:
      - "src/**/*.rs"
      - "Cargo.toml"
      - "/Cargo.toml"
      - "/Cargo.lock"
  test:
    command: "cargo test -p aureline-wasm"
    deps:
      - "aureline-parser:test"
    inputs:
      - "src/**/*.rs"
      - "Cargo.toml"
      - "/Cargo.toml"
      - "/Cargo.lock"
  build-wasm:
    command: "cargo build -p aureline-wasm --target wasm32-unknown-unknown"
    deps:
      - "aureline-parser:build"
    inputs:
      - "src/**/*.rs"
      - "Cargo.toml"
      - "/Cargo.toml"
      - "/Cargo.lock"
    outputs:
      - "/target/wasm32-unknown-unknown/debug/aureline_wasm.wasm"
  pack-web:
    command: "wasm-pack build . --target web --out-dir dist --no-pack"
    deps:
      - "aureline-wasm:build-wasm"
    inputs:
      - "src/**/*.rs"
      - "Cargo.toml"
      - "/Cargo.toml"
      - "/Cargo.lock"
    outputs:
      - "dist"
  format:
    command: "cargo fmt --package aureline-wasm --check"
    inputs:
      - "src/**/*.rs"
      - "Cargo.toml"
