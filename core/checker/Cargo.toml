[package]
name = "aureline-checker"
description = "Aureline semantic checker and diagnostics."
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"

[features]
contract-serde = ["dep:serde"]

[dependencies]
aureline-ast = { path = "../ast" }
serde = { version = "1", features = ["derive"], optional = true }

[lints]
workspace = true
