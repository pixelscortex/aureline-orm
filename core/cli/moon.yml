id: aureline-cli
language: rust

tags:
  - rust
  - cli

tasks:
  build:
    command: "cargo build -p aureline-cli"
    inputs:
      - "src/**/*.rs"
      - "Cargo.toml"
      - "/Cargo.toml"
      - "/Cargo.lock"
  check:
    command: "cargo check -p aureline-cli"
    inputs:
      - "src/**/*.rs"
      - "Cargo.toml"
      - "/Cargo.toml"
      - "/Cargo.lock"
  test:
    command: "cargo test -p aureline-cli"
    inputs:
      - "src/**/*.rs"
      - "Cargo.toml"
      - "/Cargo.toml"
      - "/Cargo.lock"
  format:
    command: "cargo fmt --package aureline-cli --check"
    inputs:
      - "src/**/*.rs"
      - "Cargo.toml"
