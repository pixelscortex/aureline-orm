[package]
name = "aureline-test"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Private Aureline contract-test harness."
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
aureline-ast = { path = "../../core/ast" }
aureline-checker = { path = "../../core/checker", features = ["contract-serde"] }
aureline-parser = { path = "../../core/parser", features = ["contract-serde"] }
chumsky = "0.13.0"
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true
